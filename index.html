<style>

filters{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-weight:800;color:#765840}.filter.on{background:#e4efd9;border-color:#96b571;color:#4e7037}.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.recipe{border:1px solid var(--line);border-radius:19px;background:white;padding:12px;text-align:left;color:#4d3525;min-height:158px}.recipe .icon{font-size:35px}.recipe h3{margin:7px 0 3px;font-size:16px}.recipe p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{border-radius:999px;padding:5px 7px;font-size:10px;font-weight:900;background:#f5eadc;color:#785b45}.tag.good{background:#e7f1dc;color:#52743c}.tag.warn{background:#fff0d2;color:#9a671d}.tag.bad{background:#ffe3dc;color:#a84e3d}.primary,.secondary,.danger{border:0;border-radius:16px;padding:13px 14px;font-weight:900}.primary{width:100%;background:linear-gradient(#98bb5d,#789d49);color:white}.primary:disabled{background:#c9c0b5;cursor:not-allowed}.secondary{background:#f1dfcb;color:#5d402d}.danger{background:#f7ddd7;color:#9f493a}.dual{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section-title{font-size:13px;font-weight:900;margin:15px 0 7px}.need-list{display:grid;gap:8px}.need{border:1px solid var(--line);border-radius:16px;background:white;padding:11px}.need-top{display:flex;align-items:center;gap:9px}.need-icon{font-size:24px;width:34px;text-align:center}.need strong{display:block}.need small{display:block;color:var(--muted);margin-top:2px}.status{margin-left:auto;font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#f1e8de;color:#7f6957}.status.have{background:#e6f0dc;color:#52733d}.status.buy{background:#ffe6dc;color:#a9533f}.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.choice button{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fffaf5;font-weight:800;color:#6a4b36}.choice button.on-have{background:#e7f2dd;border-color:#95b574;color:#4f7138}.choice button.on-buy{background:#ffe4da;border-color:#dfa08f;color:#a14b3b}.optional{font-size:10px;color:#9a7455}.tool-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.toolbtn{border:1px solid var(--line);border-radius:999px;background:#fff7ed;padding:8px 10px;font-weight:800;color:#6d503b}.toolbtn.on{background:#e4f0d9;border-color:#91b36c;color:#4f7138}.blocker{margin-top:10px;border-radius:14px;padding:10px 11px;background:#fff0ec;color:#9d4a3c;font-size:12px;line-height:1.45}.ready{margin-top:10px;border-radius:14px;padding:10px 11px;background:#eef6e7;color:#4f7139;font-size:12px;font-weight:800}.prep-list{display:grid;gap:8px}.prep{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:16px;background:white;padding:11px}.prep.done{background:#f2f8ec;border-color:#cbdcb9}.prep-check{width:30px;height:30px;border:0;border-radius:9px;background:#eee0d1;font-weight:900;color:#72543d}.prep.done .prep-check{background:#7da34b;color:white}.prep strong{display:block}.prep small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.preflight{border-radius:15px;background:#eef6e7;color:#4f7139;padding:11px;font-size:12px;line-height:1.5;font-weight:800}.cook{background:#fffaf2;border-radius:22px;padding:14px}.step{font-size:22px;line-height:1.5;font-weight:900;margin:18px 0}.timer{background:#f8ecdd;border-radius:15px;padding:11px}.pan{height:165px;margin:13px -4px 0;border-radius:50% 50% 24% 24%;background:radial-gradient(circle at 30% 35%,#d99142 0 8%,transparent 9%),radial-gradient(circle at 57% 48%,#ad542c 0 10%,transparent 11%),radial-gradient(circle at 72% 30%,#e2a353 0 9%,transparent 10%),#4d5948;border:9px solid #68735d;box-shadow:0 14px 20px #51361e33}.actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:7px;margin-top:12px}.actions button{border:0;border-radius:14px;padding:12px 6px;font-weight:900}.next{background:#7da34b;color:white}.finish{background:#e98b42;color:white}.home-grid{display:flex;flex-wrap:wrap;gap:8px}.home-item{border:1px solid var(--line);border-radius:999px;background:white;padding:9px 11px;font-weight:800;color:#5d4332}.home-item span{margin-right:4px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fffaf3ee;backdrop-filter:blur(15px);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 22px #6d47231c}.nav button{border:0;background:none;padding:7px;color:#967760;font-weight:800}.nav button.on{color:#54783b}.nav span{display:block;font-size:22px}.modal{position:fixed;inset:0;z-index:30;background:#3d291c78;display:flex;align-items:flex-end}.sheet{width:min(100%,650px);max-height:91dvh;overflow:auto;margin:auto;background:#fffaf3;border-radius:28px 28px 0 0;padding:18px}.sheet-handle{width:44px;height:5px;border-radius:99px;background:#dfcdbb;margin:-5px auto 13px}.shopping-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.shopping-row:last-child{border-bottom:0}.shopping-row .grow b{display:block}.shopping-row .grow small{color:var(--muted)}.tiny{border:0;border-radius:12px;background:#e6f0dc;color:#4f7139;padding:8px 9px;font-weight:900}.close{border:0;border-radius:12px;background:#f0dfcd;color:#654833;padding:8px 10px;font-weight:900}.toast{position:fixed;z-index:50;left:50%;bottom:93px;transform:translateX(-50%);background:#4c3628;color:white;padding:10px 14px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}@media(min-width:700px){.recipe-grid{grid-template-columns:repeat(3,1fr)}.scene{padding:20px}}

<body>
<header class="top"><div class="logo">🔪</div><div><h1>我的小厨房</h1><p id="sub">做什么</p></div><div class="grow"></div><button class="topbtn" id="shoppingBtn">购物袋 <span id="shopCount" class="badge">0</span></button></header>
<main class="wrap"><section id="root" class="scene"></section></main>
<nav class="nav"><button data-s="fridge"><span>🧊</span>冰箱</button><button data-s="board" class="on"><span>🔪</span>菜板</button><button data-s="stove"><span>🍳</span>灶台</button></nav>
<div id="modal"></div><div id="toast"></div>
<script>
const FOOD={鸡腿肉:'🍗',鸡胸肉:'🍗',猪肉:'🥩',牛肉:'🥩',土豆:'🥔',包菜:'🥬',番茄:'🍅',鸡蛋:'🥚',蘑菇:'🍄',青椒:'🫑',洋葱:'🧅',胡萝卜:'🥕',黄瓜:'🥒',青菜:'🥬',豆腐:'⬜',水饺:'🥟',挂面:'🍜'};
const SEASON=['食用油','盐','糖','生抽','老抽','料酒','醋','蚝油','淀粉','胡椒'];
const TOOLS=['炒锅','平底锅','汤锅','电饭煲','蒸锅','微波炉','空气炸锅','烤箱'];
const recipes=[
{id:'r1',name:'土豆烧鸡',icon:'🍲',cat:'肉菜',tags:['下饭','一锅'],mins:30,desc:'鸡肉和土豆一起焖，适合配米饭',ings:[['鸡腿肉','300g','切约3cm小块'],['土豆','2个','去皮切滚刀块']],season:[['食用油','适量',1],['生抽','1.5勺',1],['盐','适量',1],['老抽','半勺',0]],tools:[['炒锅','平底锅']],steps:['锅烧热后加少量油，下鸡腿肉翻炒至表面变色。','加入土豆翻炒约1分钟，再加入生抽；需要颜色更深可加老抽。','加入没过食材约一半的清水，大火煮开。','转中小火焖至土豆软糯、鸡肉熟透。','开盖收汁，尝味后补盐即可出锅。']},
{id:'r2',name:'包菜炒鸡',icon:'🥘',cat:'肉菜',tags:['快手','下饭'],mins:15,desc:'鸡肉配包菜，简单快速',ings:[['鸡腿肉','200g','切薄片或小块'],['包菜','半颗','撕成适口小片并沥干']],season:[['食用油','适量',1],['生抽','1勺',1],['盐','适量',1],['蚝油','半勺',0]],tools:[['炒锅','平底锅']],steps:['锅烧热加油，下鸡肉快速翻炒至变色。','加入包菜，保持较大火力翻炒。','加生抽和盐，喜欢更鲜可加少量蚝油。','包菜断生但仍有脆感时关火出锅。']},
{id:'r3',name:'小鸡炖蘑菇',icon:'🍲',cat:'炖菜',tags:['暖胃','一锅'],mins:40,desc:'鸡肉和蘑菇慢炖，汤汁浓郁',ings:[['鸡腿肉','300g','切块并擦干表面水分'],['蘑菇','200g','洗净，大的切半']],season:[['食用油','少量',1],['盐','适量',1],['生抽','1勺',1],['料酒','1勺',0]],tools:[['汤锅','炒锅']],steps:['锅中少量油，把鸡肉煸炒至表面微黄。','加入蘑菇翻炒至稍微变软。','加入生抽和足量热水，煮开。','转小火炖约25分钟。','最后加盐调味，再煮2分钟即可。']},
{id:'r4',name:'番茄炒蛋',icon:'🍳',cat:'快手菜',tags:['快手','家常'],mins:10,desc:'酸甜鲜香的家常经典',ings:[['番茄','2个','洗净切块'],['鸡蛋','3个','打入碗中搅散']],season:[['食用油','适量',1],['盐','适量',1],['糖','少量',0]],tools:[['炒锅','平底锅']],steps:['锅热后加油，倒入鸡蛋炒至刚凝固后盛出。','番茄下锅炒软并炒出汁水。','加盐；喜欢偏甜可加少量糖。','倒回鸡蛋，快速翻匀后出锅。']},
{id:'r5',name:'手撕包菜',icon:'🥬',cat:'素菜',tags:['快手','省事'],mins:8,desc:'脆爽下饭，食材很简单',ings:[['包菜','半颗','撕小片，洗净后充分沥干']],season:[['食用油','适量',1],['盐','适量',1],['生抽','半勺',0],['醋','少量',0]],tools:[['炒锅','平底锅']],steps:['锅烧得较热后加油。','放入包菜快速翻炒，让叶片均匀受热。','加盐，喜欢酱香可放少量生抽。','炒至断生即可；喜欢酸味可沿锅边淋一点醋。']},
{id:'r6',name:'清炒土豆丝',icon:'🥔',cat:'素菜',tags:['快手','家常'],mins:12,desc:'清爽脆口的基础家常菜',ings:[['土豆','2个','切细丝，用清水洗去表面淀粉']],season:[['食用油','适量',1],['盐','适量',1],['醋','少量',0]],tools:[['炒锅','平底锅']],steps:['锅烧热加油，下沥干的土豆丝。','大火快速翻炒约2分钟。','加盐继续翻炒至达到喜欢的软硬度。','喜欢酸味可在关火前淋少量醋。']},
{id:'r7',name:'青椒炒肉',icon:'🫑',cat:'肉菜',tags:['下饭','快手'],mins:15,desc:'青椒与猪肉的经典搭配',ings:[['猪肉','200g','切薄片'],['青椒','2个','去籽切块或丝']],season:[['食用油','适量',1],['生抽','1勺',1],['盐','适量',1],['淀粉','少量',0]],tools:[['炒锅','平底锅']],steps:['锅热加油，下猪肉快速滑炒至变色。','加入青椒大火翻炒。','加入生抽和盐调味。','青椒断生后即可出锅。']},
{id:'r8',name:'青菜面',icon:'🍜',cat:'主食',tags:['省事','一人食'],mins:12,desc:'一锅就能解决的一顿饭',ings:[['挂面','1人份','按食量取出'],['青菜','1把','洗净']],season:[['盐','适量',1],['生抽','半勺',0],['胡椒','少量',0]],tools:[['汤锅']],steps:['锅中加水烧开，下挂面并用筷子拨散。','面条煮至接近熟时加入青菜。','加盐调味，喜欢酱香可加少量生抽。','面条达到喜欢的软硬度后关火盛出。']},
{id:'r9',name:'煮水饺',icon:'🥟',cat:'主食',tags:['省事','速食'],mins:10,desc:'冷冻水饺也应该是“今天吃什么”的答案',ings:[['水饺','1人份','无需提前解冻']],season:[],tools:[['汤锅']],steps:['锅中加入足量水并烧开。','下水饺后轻轻推动，避免粘底。','再次沸腾后保持中火，按包装建议时间煮熟。','水饺全部熟透后捞出即可。']}
];
const defaultSet={seasonings:{食用油:1,盐:1,糖:1,生抽:1,老抽:0,料酒:0,醋:1,蚝油:1,淀粉:1,胡椒:0},cookware:{炒锅:1,平底锅:1,汤锅:1,电饭煲:1,蒸锅:0,微波炉:1,空气炸锅:0,烤箱:0}};
function clone(x){return JSON.parse(JSON.stringify(x))}
function uniq(a){return [...new Set(a)]}
function migrate(raw){let old=raw||{},foods=[];if(Array.isArray(old.foods))foods=old.foods;else if(Array.isArray(old.inv))foods=old.inv.filter(x=>x.kind!=='leftover'&&FOOD[x.name]).map(x=>x.name);let s={version:'0.1.3',scene:old.version==='0.1.3'&&['fridge','board','stove'].includes(old.scene)?old.scene:'board',foods:uniq(foods.filter(x=>FOOD[x])),set:clone(defaultSet),shopping:Array.isArray(old.shopping)?old.shopping:[],recipe:recipes.some(r=>r.id===old.recipe)?old.recipe:null,prep:null,cook:old.cook&&recipes.some(r=>r.id===old.cook.recipe)?old.cook:null,filter:'全部',query:''};if(old.set){s.set.seasonings={...s.set.seasonings,...(old.set.seasonings||{})};s.set.cookware={...s.set.cookware,...(old.set.cookware||{})}}s.shopping=s.shopping.filter(x=>x&&['food','seasoning','tool'].includes(x.kind));return s}
let state=migrate(JSON.parse(localStorage.getItem('mk01')||'null'));save();
function save(){localStorage.setItem('mk01',JSON.stringify(state));updateShopCount()}
function q(s){return document.querySelector(s)}function qa(s){return [...document.querySelectorAll(s)]}function close(){q('#modal').innerHTML=''}
function toast(t){q('#toast').innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>q('#toast').innerHTML='',2000)}
function key(kind,name){return kind+':'+name}function inShopping(kind,name){return state.shopping.some(x=>key(x.kind,x.name)===key(kind,name))}
function addShopping(kind,name){if(!inShopping(kind,name))state.shopping.push({kind,name})}
function removeShopping(kind,name){state.shopping=state.shopping.filter(x=>key(x.kind,x.name)!==key(kind,name))}
function markHave(kind,name){removeShopping(kind,name);if(kind==='food')state.foods=uniq([...state.foods,name]);if(kind==='seasoning')state.set.seasonings[name]=1;if(kind==='tool')state.set.cookware[name]=1;save()}
function markBuy(kind,name){addShopping(kind,name);if(kind==='food')state.foods=state.foods.filter(x=>x!==name);if(kind==='seasoning')state.set.seasonings[name]=0;if(kind==='tool')state.set.cookware[name]=0;save()}
function has(kind,name){if(kind==='food')return state.foods.includes(name);if(kind==='seasoning')return !!state.set.seasonings[name];if(kind==='tool')return !!state.set.cookware[name];return false}
function recipeState(r){let required=[];r.ings.forEach(x=>required.push(['food',x[0]]));r.season.filter(x=>x[2]).forEach(x=>required.push(['seasoning',x[0]]));let have=required.filter(x=>has(x[0],x[1])).length,buy=required.filter(x=>inShopping(x[0],x[1])).length,pending=required.length-have-buy;let toolReady=r.tools.every(g=>g.some(n=>has('tool',n))),toolBuy=r.tools.some(g=>g.every(n=>inShopping('tool',n)));return{have,total:required.length,buy,pending,toolReady,toolBuy,ready:have===required.length&&toolReady}}
function blockers(r){let a=[];let req=[...r.ings.map(x=>['food',x[0]]),...r.season.filter(x=>x[2]).map(x=>['seasoning',x[0]])];let pending=req.filter(x=>!has(x[0],x[1])&&!inShopping(x[0],x[1]));let buy=req.filter(x=>inShopping(x[0],x[1]));if(pending.length)a.push('还有 '+pending.length+' 项未确认');if(buy.length)a.push('购物清单里还有 '+buy.length+' 项');let badTools=r.tools.filter(g=>!g.some(n=>has('tool',n)));if(badTools.length)a.push('缺厨具：'+badTools.map(g=>g.join(' / ')).join('；'));return a}
function updateShopCount(){let e=q('#shopCount');if(e)e.textContent=state.shopping.length}
function go(scene){state.scene=scene;state.prep=null;save();render()}
function render(){qa('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===state.scene));q('#sub').textContent=state.scene==='board'?(state.prep?'准备食材':'做什么'):state.scene==='fridge'?'有什么':'怎么做';if(state.scene==='board')board();if(state.scene==='fridge')fridge();if(state.scene==='stove')stove()}
function board(){if(state.prep){prepView();return}let cats=['全部','快手菜','肉菜','素菜','炖菜','主食'];let filtered=recipes.filter(r=>(state.filter==='全部'||r.cat===state.filter)&&(!state.query||r.name.includes(state.query)||r.ings.some(x=>x[0].includes(state.query))||r.tags.some(x=>x.includes(state.query))));q('#root').innerHTML=`<div class="hero"><h3>今天做什么？</h3><p>先选菜，不用先整理冰箱。点开菜谱后，只要告诉我“家里有”还是“需要买”。</p></div><div class="card"><input id="recipeSearch" class="search" placeholder="搜索菜名或食材，例如：鸡腿、土豆" value="${state.query}"><div class="filters">${cats.map(c=>`<button class="filter ${state.filter===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="recipe-grid">${filtered.map(r=>{let s=recipeState(r);let label=s.ready?'<span class="tag good">可以准备</span>':s.buy||s.toolBuy?`<span class="tag bad">待买 ${s.buy+(s.toolBuy?1:0)}</span>`:`<span class="tag warn">待确认 ${s.pending+(s.toolReady?0:1)}</span>`;return`<button class="recipe" data-recipe="${r.id}"><div class="icon">${r.icon}</div><h3>${r.name}</h3><p>${r.desc}</p><div class="meta"><span class="tag">约${r.mins}分钟</span><span class="tag">${r.cat}</span>${label}</div></button>`}).join('')||'<div class="empty">没有找到对应菜谱</div>'}</div></div>`;q('#recipeSearch').oninput=e=>{state.query=e.target.value.trim();save();board()};qa('[data-cat]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.cat;save();board()});qa('[data-recipe]').forEach(b=>b.onclick=()=>recipeModal(b.dataset.recipe))}
function requirementRow(kind,name,amount,optional=false){let icon=kind==='food'?(FOOD[name]||'🥣'):kind==='seasoning'?'🧂':'🍳';let h=has(kind,name),buy=inShopping(kind,name),status=h?'<span class="status have">家里有</span>':buy?'<span class="status buy">需要买</span>':'<span class="status">待确认</span>';return`<div class="need"><div class="need-top"><div class="need-icon">${icon}</div><div><strong>${name} ${optional?'<span class="optional">可省略</span>':''}</strong><small>${amount||''}</small></div>${status}</div><div class="choice"><button class="${h?'on-have':''}" data-have="${kind}|${name}">家里有</button><button class="${buy?'on-buy':''}" data-buy="${kind}|${name}">需要买</button></div></div>`}
function recipeModal(id){let r=recipes.find(x=>x.id===id);if(!r)return;state.recipe=id;save();let s=recipeState(r),why=blockers(r);q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-handle"></div><div class="head"><div><b style="font-size:19px">${r.icon} ${r.name}</b><small style="display:block;margin-top:3px">${r.desc} · 约${r.mins}分钟</small></div><button class="close" id="close">关闭</button></div><div class="section-title">食材</div><div class="need-list">${r.ings.map(x=>requirementRow('food',x[0],x[1])).join('')}</div><div class="section-title">调味</div><div class="need-list">${r.season.length?r.season.map(x=>requirementRow('seasoning',x[0],x[1],!x[2])).join(''):'<div class="muted">不需要额外调味料</div>'}</div><div class="section-title">厨具</div>${r.tools.map(g=>{let active=g.find(n=>has('tool',n));return`<div class="need"><div class="need-top"><div class="need-icon">🍳</div><div><strong>${g.join(' / ')}</strong><small>任选一种即可</small></div><span class="status ${active?'have':''}">${active?'已有 '+active:'待确认'}</span></div><div class="tool-options">${g.map(n=>`<button class="toolbtn ${has('tool',n)?'on':''}" data-toolhave="${n}">我有${n}</button>`).join('')}<button class="toolbtn ${g.every(n=>inShopping('tool',n))?'on-buy':''}" data-toolbuy="${g.join('|')}">都没有 · 需要买</button></div></div>`}).join('')}${why.length?`<div class="blocker">${why.join('；')}</div>`:'<div class="ready">✓ 必需条件已经确认，可以开始准备食材。</div>'}<div class="dual" style="margin-top:12px"><button class="secondary" id="openShop">购物袋（${state.shopping.length}）</button><button class="primary" id="startPrep" style="margin-top:0" ${s.ready?'':'disabled'}>开始准备</button></div></div></div>`;q('#close').onclick=close;qa('[data-have]').forEach(b=>b.onclick=()=>{let [k,n]=b.dataset.have.split('|');markHave(k,n);recipeModal(id)});qa('[data-buy]').forEach(b=>b.onclick=()=>{let [k,n]=b.dataset.buy.split('|');markBuy(k,n);recipeModal(id)});qa('[data-toolhave]').forEach(b=>b.onclick=()=>{markHave('tool',b.dataset.toolhave);recipeModal(id)});qa('[data-toolbuy]').forEach(b=>b.onclick=()=>{b.dataset.toolbuy.split('|').forEach(n=>markBuy('tool',n));recipeModal(id)});q('#openShop').onclick=shoppingModal;q('#startPrep').onclick=()=>{if(!recipeState(r).ready)return;state.prep={recipe:r.id,checked:{}};save();close();render()}}
function prepView(){let r=recipes.find(x=>x.id===state.prep.recipe);if(!r){state.prep=null;return board()}let done=Object.values(state.prep.checked).filter(Boolean).length;q('#root').innerHTML=`<h2>🔪 菜板 · 准备食材</h2><div class="hero"><h3>${r.icon} ${r.name}</h3><p>需要多少、怎么处理，都在这里准备好。完成后灶台只负责真正下锅。</p></div><div class="card"><div class="head"><b>食材准备</b><small>${done}/${r.ings.length}</small></div><div class="prep-list">${r.ings.map(x=>{let ck=!!state.prep.checked[x[0]];return`<div class="prep ${ck?'done':''}"><button class="prep-check" data-prep="${x[0]}">${ck?'✓':'○'}</button><div><strong>${FOOD[x[0]]||'🥣'} ${x[0]} · ${x[1]}</strong><small>${x[2]}</small></div></div>`}).join('')}</div><div class="section-title">准备调味</div><div class="meta">${r.season.map(x=>`<span class="tag ${x[2]?'good':''}">${x[0]} · ${x[1]}${x[2]?'':' · 可省'}</span>`).join('')||'<span class="muted">无额外调味</span>'}</div><div class="section-title">使用厨具</div><div class="meta">${r.tools.map(g=>`<span class="tag good">${g.find(n=>has('tool',n))}</span>`).join('')}</div><div class="dual" style="margin-top:14px"><button class="secondary" id="backRecipes">重新选菜</button><button class="primary" id="goStove" style="margin-top:0">准备好了，去灶台</button></div></div>`;qa('[data-prep]').forEach(b=>b.onclick=()=>{state.prep.checked[b.dataset.prep]=!state.prep.checked[b.dataset.prep];save();render()});q('#backRecipes').onclick=()=>{state.prep=null;save();render()};q('#goStove').onclick=()=>{if(!recipeState(r).ready){state.prep=null;save();toast('厨房条件发生变化，请重新确认');return recipeModal(r.id)}state.cook={recipe:r.id,step:0};state.prep=null;save();go('stove')}}
function stove(){if(!state.cook){q('#root').innerHTML='<h2>🍳 灶台 · 怎么做</h2><div class="card empty">还没有要做的菜。<br><button class="primary" style="margin-top:12px" onclick="go(\'board\')">去菜板选菜</button></div>';return}let r=recipes.find(x=>x.id===state.cook.recipe),i=state.cook.step;if(!r){state.cook=null;save();return stove()}q('#root').innerHTML=`<h2>🍳 灶台 · 怎么做</h2><div class="preflight">✓ 开火前已经在菜板确认食材、调味和厨具。</div><div class="card cook"><div class="head"><div><b style="font-size:18px">${r.icon} ${r.name}</b><small style="display:block;margin-top:3px">${r.desc}</small></div><b>步骤 ${i+1}/${r.steps.length}</b></div><div class="step">${r.steps[i]}</div><div class="timer">⏱️ 整道菜预计约 ${r.mins} 分钟</div><div class="pan"></div><div class="actions"><button class="secondary" id="prev">上一步</button><button class="next" id="next">下一步</button><button class="finish" id="done">完成</button></div></div>`;q('#prev').onclick=()=>{state.cook.step=Math.max(0,i-1);save();render()};q('#next').onclick=()=>{state.cook.step=Math.min(r.steps.length-1,i+1);save();render()};q('#done').onclick=()=>finishModal(r)}
function finishModal(r){let names=[...r.ings.map(x=>['food',x[0]]),...r.season.map(x=>['seasoning',x[0]])].filter(x=>has(x[0],x[1]));q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-handle"></div><div class="head"><div><b style="font-size:19px">开饭啦 🎉</b><small style="display:block;margin-top:3px">不用记用了多少，只顺手告诉我有没有刚好用完的。</small></div><button class="close" id="close">关闭</button></div><div class="section-title">有东西用完了吗？</div><div class="home-grid">${names.map(x=>`<button class="home-item" data-used="${x[0]}|${x[1]}">${x[0]==='food'?(FOOD[x[1]]||'🥣'):'🧂'} ${x[1]} · 还有</button>`).join('')}</div><button class="primary" id="finishMeal" style="margin-top:16px">完成这顿饭</button></div></div>`;let used=new Set();qa('[data-used]').forEach(b=>b.onclick=()=>{let v=b.dataset.used;used.has(v)?used.delete(v):used.add(v);let [k,n]=v.split('|');b.textContent=(k==='food'?(FOOD[n]||'🥣'):'🧂')+' '+n+(used.has(v)?' · 用完了':' · 还有');b.style.background=used.has(v)?'#ffe4da':'white'});q('#close').onclick=close;q('#finishMeal').onclick=()=>{used.forEach(v=>{let [k,n]=v.split('|');if(k==='food')state.foods=state.foods.filter(x=>x!==n);else state.set.seasonings[n]=0});state.cook=null;save();close();go('board');toast('这顿饭完成啦')}}
function fridge(){q('#root').innerHTML=`<h2>🧊 冰箱 · 有什么</h2><div class="hero"><h3>只记“家里有”</h3><p>这里不再管理克数、批次和购买日期。大部分内容会在你选菜和买菜时自动更新。</p></div><div class="card"><div class="head"><b>食材</b><small>${state.foods.length} 种</small></div>${state.foods.length?`<div class="home-grid">${state.foods.map(n=>`<button class="home-item" data-removefood="${n}"><span>${FOOD[n]||'🥣'}</span>${n}</button>`).join('')}</div><p class="muted" style="margin-bottom:0">点一下某个食材，可标记为“家里没有了”。</p>`:'<div class="empty">还没有记录食材。去菜板选一道菜，确认“家里有”后会自动出现在这里。</div>'}</div><div class="card"><div class="head"><b>常备调味</b><small>只显示已有</small></div><div class="home-grid">${SEASON.filter(n=>has('seasoning',n)).map(n=>`<button class="home-item" data-removeseason="${n}">🧂 ${n}</button>`).join('')}</div></div><div class="card"><div class="head"><b>厨具</b><small>只显示已有</small></div><div class="home-grid">${TOOLS.filter(n=>has('tool',n)).map(n=>`<button class="home-item" data-removetool="${n}">🍳 ${n}</button>`).join('')}</div></div><button class="secondary" id="manualAdd" style="width:100%">补充家里已有的食材</button>`;qa('[data-removefood]').forEach(b=>b.onclick=()=>{state.foods=state.foods.filter(x=>x!==b.dataset.removefood);save();render();toast(b.dataset.removefood+' 已标记为没有了')});qa('[data-removeseason]').forEach(b=>b.onclick=()=>{state.set.seasonings[b.dataset.removeseason]=0;save();render()});qa('[data-removetool]').forEach(b=>b.onclick=()=>{state.set.cookware[b.dataset.removetool]=0;save();render()});q('#manualAdd').onclick=manualAddModal}
function manualAddModal(){let all=Object.keys(FOOD);q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-handle"></div><div class="head"><div><b>补充家里已有</b><small style="display:block;margin-top:3px">这是纠正入口，不需要填写数量。</small></div><button class="close" id="close">关闭</button></div><div class="home-grid">${all.map(n=>`<button class="home-item" data-addhome="${n}" style="background:${state.foods.includes(n)?'#e6f0dc':'white'}">${FOOD[n]} ${n}${state.foods.includes(n)?' ✓':''}</button>`).join('')}</div></div></div>`;q('#close').onclick=close;qa('[data-addhome]').forEach(b=>b.onclick=()=>{let n=b.dataset.addhome;state.foods.includes(n)?state.foods=state.foods.filter(x=>x!==n):state.foods.push(n);save();manualAddModal()})}
function shoppingModal(){q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-handle"></div><div class="head"><div><b style="font-size:19px">🛍 购物袋</b><small style="display:block;margin-top:3px">买到后点“买到了”，会自动记进你的厨房。</small></div><button class="close" id="close">关闭</button></div>${state.shopping.length?state.shopping.map(x=>`<div class="shopping-row"><div style="font-size:24px">${x.kind==='food'?(FOOD[x.name]||'🥣'):x.kind==='seasoning'?'🧂':'🍳'}</div><div class="grow"><b>${x.name}</b><small>${x.kind==='food'?'食材':x.kind==='seasoning'?'调味料':'厨具'}</small></div><button class="tiny" data-bought="${x.kind}|${x.name}">买到了</button><button class="close" data-rmshop="${x.kind}|${x.name}">移除</button></div>`).join(''):'<div class="empty">购物袋是空的。选菜时点“需要买”，会自动放到这里。</div>'}</div></div>`;q('#close').onclick=close;qa('[data-bought]').forEach(b=>b.onclick=()=>{let [k,n]=b.dataset.bought.split('|');markHave(k,n);shoppingModal();toast(n+' 已记为家里有')});qa('[data-rmshop]').forEach(b=>b.onclick=()=>{let [k,n]=b.dataset.rmshop.split('|');removeShopping(k,n);save();shoppingModal()})}
qa('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));q('#shoppingBtn').onclick=shoppingModal;updateShopCount();render();
</script>
</body></html>
