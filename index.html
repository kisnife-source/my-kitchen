<style>

0d8;color:#52733b;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.tag{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.priority{background:#ffe0d7;color:#ad4937}.soon{background:#fff0bf;color:#946716}.later{background:#e3efd8;color:#52733b}.primary{width:100%;padding:14px 16px;border:0;border-radius:18px;background:linear-gradient(#9abd5d,#789e47);color:white;font-weight:900;font-size:16px;margin-top:10px}.primary:disabled{background:#c8c0b5}.secondary{padding:11px 13px;border:0;border-radius:15px;background:#f4e3cf;font-weight:800;color:#553822}.dual{display:grid;grid-template-columns:1fr 1fr;gap:8px}.board{background:linear-gradient(#cc8b50,#b8703b);border-radius:24px;padding:14px;color:#fff}.selected{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sel{background:#ffffff18;border:1px solid #ffffff55;border-radius:16px;text-align:center;padding:10px 6px}.sel .emo{font-size:34px}.sel small{display:block}.pick-list{display:flex;flex-wrap:wrap;gap:7px}.pick-chip{padding:10px 12px;border:1px solid #e3d2bf;border-radius:999px;background:#f4e3cf;color:#553822;font-weight:800}.pick-chip.on{background:#e3efd8;border-color:#94b668;color:#456532}.hint{background:#f8efe3;border-radius:14px;padding:10px 12px;color:#755a45;font-size:12px;line-height:1.5}.recipe{background:#fff;border:2px solid transparent;border-radius:18px;padding:12px;margin-top:9px;color:#4d3525}.recipe.pick{border-color:#91b65b;background:#fbfff8}.rTop{display:flex;gap:10px;align-items:center}.dish{font-size:32px;width:50px;height:50px;border-radius:14px;background:#f6e8d5;display:grid;place-items:center;flex:0 0 auto}.rTop h3{margin:0;font-size:16px}.coverage{display:inline-block;margin-top:6px;padding:4px 7px;background:#eee8ff;color:#66558d;border-radius:999px;font-size:10px;font-weight:900}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.check{background:#faf0e5;border-radius:12px;padding:8px;font-size:11px;line-height:1.35}.ok{color:#52773a}.warn{color:#d06a2c}.bad{color:#b74b3c}.blockers{margin-top:8px;padding:9px 11px;border-radius:13px;background:#fff0ed;color:#a04b3f;font-size:11px;font-weight:800}.preflight{padding:9px 11px;border-radius:15px;background:#eef4e8;color:#4f7337;font-size:11px;font-weight:800;line-height:1.5}.cook{background:#fffaf2;border-radius:22px;padding:14px}.cook h3{font-size:18px;margin:0}.step{font-size:23px;line-height:1.45;font-weight:900;margin:18px 0}.timer{background:#f8eddf;border-radius:15px;padding:12px;margin:10px 0}.pan{height:180px;margin:12px -5px 0;border-radius:50% 50% 24% 24%;background:radial-gradient(circle at 30% 35%,#d99142 0 8%,transparent 9%),radial-gradient(circle at 55% 45%,#ad542c 0 10%,transparent 11%),radial-gradient(circle at 72% 30%,#e2a353 0 9%,transparent 10%),radial-gradient(circle at 42% 68%,#c46c2c 0 9%,transparent 10%),#4d5948;border:9px solid #68735d;box-shadow:0 14px 20px #51361e33}.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px}.actions button{padding:13px 8px;border:0;border-radius:16px;font-weight:900}.next{background:#80a94e;color:#fff}.finish{background:#ed8a3e;color:#fff}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fffaf3ee;backdrop-filter:blur(15px);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 22px #6d47231c}.nav button{border:0;background:none;padding:7px;color:#967760;font-weight:800}.nav button.on{color:#54783b}.nav span{display:block;font-size:22px}.modal{position:fixed;inset:0;z-index:30;background:#3d291c77;display:flex;align-items:flex-end}.sheet{width:min(100%,620px);max-height:88dvh;overflow:auto;margin:auto;background:#fffaf3;border-radius:28px 28px 0 0;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.catalog-status{padding:10px 12px;border-radius:13px;background:#eef4e8;color:#52733b;margin:7px 0;font-size:12px}.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:245px;overflow:auto;padding:2px}.catalog-item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;text-align:left;font-weight:800;color:#513724}.catalog-item.on{background:#e5f0da;border-color:#94b668}.catalog-item small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toggle{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.toggle.on{background:#e5f0da;border-color:#94b668}.toast{position:fixed;z-index:40;left:50%;bottom:95px;transform:translateX(-50%);background:#4c3628;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.empty{padding:24px;text-align:center;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.scene{padding:20px}.catalog{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="logo">🍳</div><div><h1>我的小厨房</h1><p id="sub">有什么</p></div><div class="grow"></div><button class="pill" id="staples">厨房常备</button></header>
<main class="wrap"><section id="root" class="scene"></section></main>
<nav class="nav"><button data-s="fridge" class="on"><span>🧊</span>冰箱</button><button data-s="board"><span>🔪</span>菜板</button><button data-s="stove"><span>🍳</span>灶台</button></nav><div id="modal"></div><div id="toast"></div>
<script>
const FOOD=[
{name:'鸡腿肉',icon:'🍗',unit:'g',storage:'chilled'},{name:'鸡胸肉',icon:'🍗',unit:'g',storage:'chilled'},{name:'猪肉',icon:'🥩',unit:'g',storage:'chilled'},{name:'牛肉',icon:'🥩',unit:'g',storage:'chilled'},
{name:'土豆',icon:'🥔',unit:'个',storage:'room'},{name:'包菜',icon:'🥬',unit:'颗',storage:'chilled'},{name:'番茄',icon:'🍅',unit:'个',storage:'chilled'},{name:'鸡蛋',icon:'🥚',unit:'个',storage:'chilled'},
{name:'蘑菇',icon:'🍄',unit:'g',storage:'chilled'},{name:'青椒',icon:'🫑',unit:'个',storage:'chilled'},{name:'洋葱',icon:'🧅',unit:'个',storage:'room'},{name:'胡萝卜',icon:'🥕',unit:'根',storage:'chilled'},
{name:'黄瓜',icon:'🥒',unit:'根',storage:'chilled'},{name:'青菜',icon:'🥬',unit:'把',storage:'chilled'},{name:'豆腐',icon:'⬜',unit:'盒',storage:'chilled'},{name:'牛奶',icon:'🥛',unit:'盒',storage:'chilled'},
{name:'水饺',icon:'🥟',unit:'袋',storage:'frozen'},{name:'包子',icon:'🥟',unit:'袋',storage:'frozen'},{name:'馒头',icon:'🍞',unit:'袋',storage:'frozen'},{name:'香肠',icon:'🌭',unit:'根',storage:'chilled'},
{name:'大米',icon:'🍚',unit:'kg',storage:'room'},{name:'挂面',icon:'🍜',unit:'袋',storage:'room'}
];
const FOODMAP=Object.fromEntries(FOOD.map(x=>[x.name,x]));
const E=Object.fromEntries(FOOD.map(x=>[x.name,x.icon]));
const META={chilled:['冷藏','0~4°C'],frozen:['冷冻','-18°C以下'],room:['常温','阴凉干燥'],ready:['熟食 / 半成品','尽快吃完']};
const UNITS=['g','kg','个','颗','根','把','袋','盒','份'];
const defaultInv=[['鸡腿肉',300,'g','chilled','priority'],['土豆',2,'个','room','priority'],['包菜',.5,'颗','chilled','soon'],['水饺',.5,'袋','frozen','soon'],['牛奶',.5,'盒','chilled','later'],['土豆烧鸡',1,'份','ready','priority','leftover']].map((x,i)=>({id:'i'+i,name:x[0],quantity:x[1],unit:x[2],storage:x[3],urgency:x[4],kind:x[5]||'food'}));
const defaultSet={seasonings:{盐:1,糖:1,生抽:1,老抽:0,料酒:0,醋:1,蚝油:1,淀粉:1},cookware:{炒锅:1,平底锅:1,汤锅:1,电饭煲:1,蒸锅:0,微波炉:1,空气炸锅:0,烤箱:0}};
const recipes=[
{id:'r1',name:'土豆烧鸡',icon:'🍲',desc:'家常美味 · 下饭首选',ings:[['鸡腿肉',300,'g',1],['土豆',2,'个',1]],season:[['生抽',1],['盐',1],['老抽',0]],tools:[['炒锅','平底锅']],steps:['鸡腿肉切块，土豆切块备用。','锅中少量油，下鸡腿肉炒至表面变色。','加入土豆块翻炒，加入生抽、老抽、盐调味。','加入适量清水，煮开后转中小火。','焖至土豆软糯、鸡肉熟透。','开盖收汁，尝味后出锅。']},
{id:'r2',name:'包菜炒鸡',icon:'🥘',desc:'清爽鲜香 · 快手下饭',ings:[['鸡腿肉',200,'g',1],['包菜',.5,'颗',1]],season:[['生抽',1],['盐',1],['蚝油',0]],tools:[['炒锅','平底锅']],steps:['鸡肉切小块，包菜撕成小片。','鸡肉下锅炒至变色。','加入包菜，大火快速翻炒。','加入生抽和盐调味。','包菜断生后即可出锅。']},
{id:'r3',name:'小鸡炖蘑菇',icon:'🍲',desc:'暖乎乎的一锅炖',ings:[['鸡腿肉',300,'g',1],['蘑菇',200,'g',1]],season:[['盐',1],['生抽',1],['料酒',0]],tools:[['汤锅','炒锅']],steps:['鸡肉和蘑菇处理干净。','鸡肉先煸炒出香味。','加入蘑菇翻炒。','加水与调味料煮开。','转小火炖至鸡肉熟透。','尝味出锅。']},
{id:'r4',name:'番茄炒蛋',icon:'🍳',desc:'简单快手 · 家常经典',ings:[['番茄',2,'个',1],['鸡蛋',3,'个',1]],season:[['盐',1],['糖',0]],tools:[['炒锅','平底锅']],steps:['番茄切块，鸡蛋打散。','锅中放油，先把鸡蛋炒至凝固后盛出。','番茄下锅炒软出汁。','加盐，喜欢偏甜可加少量糖。','倒回鸡蛋快速翻匀即可出锅。']}
];
function clone(x){return JSON.parse(JSON.stringify(x))}
function migrateState(raw){let s=raw||{};s.inv=Array.isArray(s.inv)?s.inv:clone(defaultInv);s.set=s.set||clone(defaultSet);s.set.seasonings={...defaultSet.seasonings,...(s.set.seasonings||{})};s.set.cookware={...defaultSet.cookware,...(s.set.cookware||{})};s.inv=s.inv.map(x=>{let y={...x};if(y.name==='昨晚土豆烧鸡'){y.name='土豆烧鸡';y.kind='leftover';y.storage='ready'}if(!y.kind)y.kind=y.storage==='ready'?'leftover':'food';return y}).filter(x=>x.kind==='leftover'||!!FOODMAP[x.name]);s.selected=(Array.isArray(s.selected)?s.selected:[]).filter(id=>s.inv.some(x=>x.id===id&&x.kind==='food'));s.recipe=recipes.some(r=>r.id===s.recipe)?s.recipe:'r1';s.scene=['fridge','board','stove'].includes(s.scene)?s.scene:'fridge';s.cook=s.cook&&recipes.some(r=>r.id===s.cook.recipe)?s.cook:null;s.version='0.1.1';return s}
let state=migrateState(JSON.parse(localStorage.getItem('mk01')||'null'));save();
function save(){localStorage.setItem('mk01',JSON.stringify(state))}function q(s){return document.querySelector(s)}function qa(s){return [...document.querySelectorAll(s)]}function fmt(x){return x.quantity===.5&&['袋','盒','颗'].includes(x.unit)?'半'+x.unit:(x.quantity+x.unit)}function urgent(u){return {priority:['优先处理','priority'],soon:['最近可以安排','soon'],later:['暂时不急','later']}[u]||['最近可以安排','soon']}
function go(s){state.scene=s;save();render()}function toast(t){q('#toast').innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>q('#toast').innerHTML='',2200)}function close(){q('#modal').innerHTML=''}
function selectedNames(){return state.inv.filter(x=>state.selected.includes(x.id)&&x.kind==='food').map(x=>x.name)}
function inventoryAmount(name,unit){return state.inv.filter(x=>x.kind==='food'&&x.name===name&&x.unit===unit).reduce((sum,x)=>sum+x.quantity,0)}
function checkRecipe(r){let miss=[];for(const a of r.ings){let have=inventoryAmount(a[0],a[2]);if(have<a[1])miss.push(have?`${a[0]}（还差${+(a[1]-have).toFixed(1)}${a[2]}）`:a[0])}let sm=r.season.filter(x=>x[1]&&!state.set.seasonings[x[0]]).map(x=>x[0]),so=r.season.filter(x=>!x[1]&&!state.set.seasonings[x[0]]).map(x=>x[0]);let missingToolGroups=r.tools.filter(group=>!group.some(x=>state.set.cookware[x]));let matchedTools=r.tools.map(group=>group.find(x=>state.set.cookware[x])).filter(Boolean);let names=selectedNames(),recipeNames=r.ings.map(x=>x[0]),covered=names.filter(n=>recipeNames.includes(n));return{miss,sm,so,missingToolGroups,matchedTools,covered,coverage:names.length?covered.length/names.length:0,ok:!miss.length&&!sm.length&&!missingToolGroups.length}}
function toolStatus(c){if(c.missingToolGroups.length)return '缺：'+c.missingToolGroups.map(g=>g.join(' / ')+'（选一种）').join('；');return (c.matchedTools.join(' + ')||'无需特殊厨具')+' ✓'}
function blockers(c){let a=[];if(c.miss.length)a.push('食材：'+c.miss.join('、'));if(c.sm.length)a.push('调味：'+c.sm.join('、'));if(c.missingToolGroups.length)a.push('厨具：'+c.missingToolGroups.map(g=>g.join(' / ')+'（选一种）').join('；'));return a}
function render(){qa('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===state.scene));q('#sub').textContent={fridge:'有什么',board:'做什么',stove:'怎么做'}[state.scene];if(state.scene==='fridge')fridge();if(state.scene==='board')board();if(state.scene==='stove')stove()}
function fridge(){let html='<h2>🧊 冰箱 · 有什么</h2><div class="hint">这里只能从内置食材库添加，避免“测试”这类无效内容进入库存。需要做菜时去菜板指定想优先使用的食材。</div><div class="fridge">';for(const [k,m] of Object.entries(META)){let arr=state.inv.filter(x=>x.storage===k);html+=`<div class="card"><div class="head"><b>${m[0]}</b><small>${m[1]}</small></div><div class="grid">${arr.length?arr.map(x=>`<button class="food ${state.selected.includes(x.id)?'selected-food':''}" data-edit="${x.id}"><div class="emo">${x.kind==='leftover'?'🍱':(E[x.name]||'🥣')}</div><strong>${x.name}</strong><small>${fmt(x)}</small>${state.selected.includes(x.id)?'<span class="mini-selected">菜板已选</span>':''}<span class="tag ${urgent(x.urgency)[1]}">${urgent(x.urgency)[0]}</span></button>`).join(''):'<div class="empty">暂无食物</div>'}</div></div>`}html+='</div><div class="dual"><button class="secondary" id="toBoard">去菜板选食材</button><button class="primary" id="add" style="margin-top:0">＋ 添加食材</button></div>';q('#root').innerHTML=html;q('#add').onclick=()=>foodModal();q('#toBoard').onclick=()=>go('board');qa('[data-edit]').forEach(b=>b.onclick=()=>{let x=state.inv.find(i=>i.id===b.dataset.edit);x&&x.kind==='leftover'?leftoverModal(x.id):foodModal(x.id)})}
function board(){let selected=state.inv.filter(x=>state.selected.includes(x.id)&&x.kind==='food'),names=selectedNames();let ranks=recipes.map(r=>[r,checkRecipe(r)]).filter(([r,c])=>!names.length||c.covered.length>0).sort((a,b)=>b[1].covered.length-a[1].covered.length||Number(b[1].ok)-Number(a[1].ok)||a[1].miss.length-b[1].miss.length);if(ranks.length&&!ranks.some(([r])=>r.id===state.recipe)){state.recipe=ranks[0][0].id;save()}q('#root').innerHTML=`<h2>🔪 菜板 · 做什么</h2><div class="board"><div class="head"><b>指定想优先使用的食材</b><small>已选 ${selected.length} 种</small></div>${selected.length?`<div class="selected">${selected.slice(0,3).map(x=>`<div class="sel"><div class="emo">${E[x.name]||'🥣'}</div><strong>${x.name}</strong><small>${fmt(x)}</small></div>`).join('')}</div>`:'<div class="empty" style="color:#fff9">还没指定食材</div>'}</div><div class="card"><div class="head"><b>从冰箱选择</b><button class="secondary" id="clearPick" style="padding:7px 10px">清空</button></div><div class="pick-list">${state.inv.filter(x=>x.kind==='food').map(x=>`<button class="pick-chip ${state.selected.includes(x.id)?'on':''}" data-pick="${x.id}">${E[x.name]||'🥣'} ${x.name}</button>`).join('')}</div><div class="hint" style="margin-top:10px">选中的食材就是推荐条件：只展示至少会用到其中一种的菜，并优先推荐能用掉更多已选食材的菜。</div></div><div class="card"><div class="head"><b>根据现有条件推荐</b><small>食材 + 调味 + 厨具</small></div>${ranks.length?ranks.map(([r,c])=>`<div class="recipe ${state.recipe===r.id?'pick':''}" data-r="${r.id}"><div class="rTop"><div class="dish">${r.icon}</div><div class="grow"><h3>${r.name}</h3><small>${r.desc}</small>${names.length?`<span class="coverage">用上 ${c.covered.length}/${names.length} 种已选食材</span>`:''}</div><b class="${c.ok?'ok':'warn'}">${c.ok?'可直接做':'需补条件'}</b></div><div class="checks"><div class="check">食材<br><b class="${c.miss.length?'bad':'ok'}">${c.miss.length?'缺 '+c.miss.join('、'):'已齐 ✓'}</b></div><div class="check">调味<br><b class="${c.sm.length?'bad':c.so.length?'warn':'ok'}">${c.sm.length?'缺 '+c.sm.join('、'):c.so.length?'缺 '+c.so.join('、')+' · 可省略':'已齐 ✓'}</b></div><div class="check">厨具<br><b class="${c.missingToolGroups.length?'bad':'ok'}">${toolStatus(c)}</b></div></div>${blockers(c).length?`<div class="blockers">开始前需要解决：${blockers(c).join('；')}</div>`:''}</div>`).join(''):'<div class="empty">当前菜谱库里还没有使用这些指定食材的菜。可以减少选择，或等待后续扩充菜谱。</div>'}${ranks.length?'<button class="primary" id="start">开始准备</button>':''}</div>`;qa('[data-pick]').forEach(b=>b.onclick=()=>{state.selected.includes(b.dataset.pick)?state.selected=state.selected.filter(x=>x!==b.dataset.pick):state.selected.push(b.dataset.pick);save();render()});q('#clearPick').onclick=()=>{state.selected=[];save();render()};qa('[data-r]').forEach(b=>b.onclick=()=>{state.recipe=b.dataset.r;save();render()});if(q('#start'))q('#start').onclick=()=>{let r=recipes.find(x=>x.id===state.recipe),c=checkRecipe(r),why=blockers(c);if(!c.ok)return toast('还不能开始：'+why.join('；'));state.cook={recipe:r.id,step:0};save();go('stove')}}
function stove(){if(!state.cook){q('#root').innerHTML='<h2>🍳 灶台 · 怎么做</h2><div class="card empty">还没有开始做菜。先去菜板选一道能做的菜吧。<br><button class="primary" onclick="go(\'board\')">去菜板</button></div>';return}let r=recipes.find(x=>x.id===state.cook.recipe),c=checkRecipe(r),i=state.cook.step;if(!c.ok){state.cook=null;save();q('#root').innerHTML=`<h2>🍳 灶台 · 怎么做</h2><div class="card"><b class="bad">制作条件发生变化</b><p>${blockers(c).join('；')}</p><button class="primary" onclick="go('board')">回菜板检查</button></div>`;return}q('#root').innerHTML=`<h2>🍳 灶台 · 怎么做</h2><div class="preflight">开火前已确认：食材齐全；必需调味齐全${c.so.length?'（'+c.so.join('、')+'可省略）':''}；厨具使用 ${c.matchedTools.join(' + ')}。</div><div class="card cook"><div class="head"><div><h3>${r.icon} ${r.name}</h3><small>${r.desc}</small></div><b>步骤 ${i+1}/${r.steps.length}</b></div><div class="step">${r.steps[i]}</div><div class="timer">⏱️ 预计剩余时间：约 ${Math.max(5,(r.steps.length-i)*5)} 分钟</div><div class="pan"></div><div class="actions"><button class="secondary" id="prev">上一步</button><button class="next" id="next">下一步</button><button class="finish" id="done">完成烹饪</button></div></div>`;q('#prev').onclick=()=>{state.cook.step=Math.max(0,i-1);save();render()};q('#next').onclick=()=>{state.cook.step=Math.min(r.steps.length-1,i+1);save();render()};q('#done').onclick=()=>finishModal(r)}
function foodModal(id){let x=state.inv.find(i=>i.id===id),initial=x&&FOODMAP[x.name]?x.name:null,picked=initial;let base=x||{name:'',quantity:1,unit:'个',storage:'chilled',urgency:'soon'};q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>${id?'编辑食材':'添加食材'}</b><button class="secondary" id="close">关闭</button></div><p class="muted">先从食材库选择。输入文字只用于搜索，不能把任意文字直接保存进冰箱。</p><label class="field">搜索食材<input id="foodSearch" placeholder="例如：鸡腿肉、土豆、番茄" autocomplete="off"></label><div id="pickedStatus" class="catalog-status">${picked?'已选择：'+picked:'尚未选择食材'}</div><div id="catalog" class="catalog"></div><div class="row"><label class="field">数量<input id="fq" type="number" min="0.1" step="0.1" value="${base.quantity}"></label><label class="field">单位<select id="fu">${UNITS.map(v=>`<option ${v===base.unit?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="row"><label class="field">存放<select id="fs">${Object.entries(META).filter(([k])=>k!=='ready').map(([k,v])=>`<option value="${k}" ${k===base.storage?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="field">安排<select id="fg"><option value="priority" ${base.urgency==='priority'?'selected':''}>优先处理</option><option value="soon" ${base.urgency==='soon'?'selected':''}>最近安排</option><option value="later" ${base.urgency==='later'?'selected':''}>暂时不急</option></select></label></div><div class="row">${id?'<button class="secondary" id="del">删除</button>':'<span></span>'}<button class="primary" id="savef">保存</button></div></div></div>`;function drawCatalog(filter=''){let key=filter.trim().toLowerCase(),arr=FOOD.filter(f=>!key||f.name.toLowerCase().includes(key));q('#catalog').innerHTML=arr.length?arr.map(f=>`<button class="catalog-item ${picked===f.name?'on':''}" data-food="${f.name}"><span>${f.icon} ${f.name}</span><small>默认：${META[f.storage][0]} · ${f.unit}</small></button>`).join(''):'<div class="empty">食材库中没有匹配项</div>';qa('[data-food]').forEach(b=>b.onclick=()=>{picked=b.dataset.food;let f=FOODMAP[picked];q('#pickedStatus').textContent='已选择：'+picked;q('#fu').value=f.unit;q('#fs').value=f.storage;drawCatalog(q('#foodSearch').value)})}drawCatalog();q('#foodSearch').oninput=e=>drawCatalog(e.target.value);q('#close').onclick=close;q('#savef').onclick=()=>{let qty=+q('#fq').value;if(!picked)return toast('请先从食材库选择一个食材');if(!qty||qty<=0)return toast('请输入正确数量');let o={id:id||'i'+Date.now(),name:picked,quantity:qty,unit:q('#fu').value,storage:q('#fs').value,urgency:q('#fg').value,kind:'food'};state.inv=id?state.inv.map(a=>a.id===id?o:a):[...state.inv,o];save();close();render()};if(id)q('#del').onclick=()=>{state.inv=state.inv.filter(a=>a.id!==id);state.selected=state.selected.filter(a=>a!==id);save();close();render()}}
function leftoverModal(id){let x=state.inv.find(i=>i.id===id);if(!x)return;q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>编辑剩菜</b><button class="secondary" id="close">关闭</button></div><div class="catalog-status">🍱 ${x.name}</div><div class="row"><label class="field">剩余份数<input id="fq" type="number" min="0.1" step="0.5" value="${x.quantity}"></label><label class="field">安排<select id="fg"><option value="priority" ${x.urgency==='priority'?'selected':''}>优先处理</option><option value="soon" ${x.urgency==='soon'?'selected':''}>最近安排</option></select></label></div><div class="row"><button class="secondary" id="del">吃完 / 删除</button><button class="primary" id="savef">保存</button></div></div></div>`;q('#close').onclick=close;q('#savef').onclick=()=>{x.quantity=+q('#fq').value||1;x.urgency=q('#fg').value;save();close();render()};q('#del').onclick=()=>{state.inv=state.inv.filter(a=>a.id!==id);save();close();render()}}
function staples(){q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>厨房常备</b><button class="secondary" id="close">关闭</button></div><p class="muted">这里只记录“有 / 没有”。菜板会明确告诉你缺哪种必需调味料，以及缺哪一组厨具。</p><h3>调味料</h3><div class="toggles">${Object.keys(state.set.seasonings).map(n=>`<button class="toggle ${state.set.seasonings[n]?'on':''}" data-g="seasonings" data-n="${n}">${n}</button>`).join('')}</div><h3>厨具</h3><div class="toggles">${Object.keys(state.set.cookware).map(n=>`<button class="toggle ${state.set.cookware[n]?'on':''}" data-g="cookware" data-n="${n}">${n}</button>`).join('')}</div><button class="primary" id="saves">保存</button></div></div>`;q('#close').onclick=close;qa('.toggle').forEach(b=>b.onclick=()=>b.classList.toggle('on'));q('#saves').onclick=()=>{qa('.toggle').forEach(b=>state.set[b.dataset.g][b.dataset.n]=b.classList.contains('on')?1:0);save();close();render();toast('厨房常备已保存')}}
function finishModal(r){q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>这顿饭怎么样？</b><button class="secondary" id="close">关闭</button></div><p class="muted">不用称重，选一个最接近的结果即可。</p><button class="primary" data-f="done">吃完了</button><button class="primary" data-f="left" style="margin-top:8px;background:#d49b57">还有剩菜</button><button class="secondary" data-f="half" style="width:100%;margin-top:8px">只做了一部分</button></div></div>`;q('#close').onclick=close;qa('[data-f]').forEach(b=>b.onclick=()=>finish(r,b.dataset.f))}
function finish(r,type){let factor=type==='half'?.5:1;r.ings.filter(a=>a[3]).forEach(a=>{let need=a[1]*factor,items=state.inv.filter(i=>i.kind==='food'&&i.name===a[0]&&i.unit===a[2]);for(const x of items){let used=Math.min(need,x.quantity);x.quantity-=used;need-=used;if(need<=.001)break}state.inv=state.inv.filter(i=>i.quantity>.001)});if(type==='left')state.inv.push({id:'i'+Date.now(),name:r.name,quantity:1,unit:'份',storage:'ready',urgency:'priority',kind:'leftover'});state.selected=state.selected.filter(id=>state.inv.some(x=>x.id===id));state.cook=null;save();close();go('fridge');toast(type==='left'?'剩菜已放回冰箱':'库存已更新')}
qa('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));q('#staples').onclick=staples;render();
</script>
</body></html>
