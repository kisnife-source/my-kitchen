<!doctype html>
<html lang="zh-CN">
<head>

<title>我的小厨房 V0.5.5</title>

<body>
<header class="top">
  <div class="logo">🔪</div>
  <div class="top-title"><h1>我的小厨房</h1><p id="sub">做什么</p></div>
  <div class="grow"></div>

<main class="wrap"><section id="root" class="scene"></section></main>

<nav class="nav">
  <button data-s="home"><span>🏠</span>首页</button>
  <button data-s="fridge"><span>🧊</span>冰箱</button>
  <button data-s="board"><span>📖</span>菜谱</button>
  <button data-s="stove"><span>🍳</span>灶台</button>
  <button data-s="mine"><span>👤</span>我的</button>
</nav>

<div id="modal"></div>
<div id="toast"></div>

<script>
window.MK_VERSION='0.5.5';
try{
  window.__MK_PRELOAD=JSON.parse(localStorage.getItem('mk01')||'null');
}catch(e){
  window.__MK_PRELOAD=null;
}
window.__MK_HAD_STATE=!!window.__MK_PRELOAD;
</script>

<!-- Runtime is intentionally split around the generated recipe dataset. -->
<script src="src/runtime-core.js?v=0.5.5"></script>
