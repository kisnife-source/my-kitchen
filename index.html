<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a96f3f">
<title>我的小厨房 V0.1</title>
<style>
:root{--bg:#f4e3ce;--wood:#b97842;--deep:#7d4d29;--paper:#fffaf3;--green:#7da34b;--orange:#eb8a43;--muted:#8d735f;--line:#eadac8;font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#4d3525}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b97c45 0 110px,var(--bg) 110px);min-height:100dvh}.top{position:sticky;top:0;z-index:9;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff;background:rgba(155,93,48,.94);display:flex;align-items:center;gap:12px;backdrop-filter:blur(12px)}.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff3df;font-size:24px}.top h1{font-size:22px;margin:0}.top p{font-size:12px;margin:3px 0 0;opacity:.85}.grow{flex:1}.pill,.btn{border:0;border-radius:999px;font:inherit;font-weight:800}.pill{padding:9px 12px;background:#fff7e9;color:#553822}.wrap{max-width:760px;margin:auto;padding:14px 14px 105px}.scene{border-radius:28px;padding:14px;background:linear-gradient(145deg,#ecd0ae,#f8ead8);box-shadow:0 16px 35px #7d4d2924;min-height:calc(100dvh - 185px)}.scene h2{margin:4px 4px 12px;font-size:20px}.card{background:rgba(255,250,243,.97);border:1px solid #ffffffaa;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 8px 18px #6a43201a}.fridge{background:linear-gradient(#fffefa,#f2e9df);border-radius:30px;padding:12px;box-shadow:inset 0 0 0 5px #fff8}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.head b{font-size:16px}.head small,.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.food{border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px;text-align:left;min-height:116px}.food .emo{font-size:34px}.food strong{display:block;margin-top:8px}.tag{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.priority{background:#ffe0d7;color:#ad4937}.soon{background:#fff0bf;color:#946716}.later{background:#e3efd8;color:#52733b}.primary{width:100%;padding:14px 16px;border:0;border-radius:18px;background:linear-gradient(#9abd5d,#789e47);color:white;font-weight:900;font-size:16px;margin-top:10px}.primary:disabled{background:#c8c0b5}.secondary{padding:11px 13px;border:0;border-radius:15px;background:#f4e3cf;font-weight:800}.board{background:linear-gradient(#cc8b50,#b8703b);border-radius:24px;padding:14px;color:#fff}.selected{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sel{background:#ffffff18;border:1px solid #ffffff55;border-radius:16px;text-align:center;padding:10px 6px}.sel .emo{font-size:34px}.recipe{background:#fff;border:2px solid transparent;border-radius:18px;padding:12px;margin-top:9px;color:#4d3525}.recipe.pick{border-color:#91b65b;background:#fbfff8}.rTop{display:flex;gap:10px;align-items:center}.dish{font-size:32px;width:50px;height:50px;border-radius:14px;background:#f6e8d5;display:grid;place-items:center}.rTop h3{margin:0;font-size:16px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.check{background:#faf0e5;border-radius:12px;padding:8px;font-size:11px}.ok{color:#52773a}.warn{color:#d06a2c}.bad{color:#b74b3c}.preflight{padding:9px 11px;border-radius:999px;background:#eef4e8;color:#4f7337;font-size:11px;font-weight:800}.cook{background:#fffaf2;border-radius:22px;padding:14px}.cook h3{font-size:18px;margin:0}.step{font-size:23px;line-height:1.45;font-weight:900;margin:18px 0}.timer{background:#f8eddf;border-radius:15px;padding:12px;margin:10px 0}.pan{height:180px;margin:12px -5px 0;border-radius:50% 50% 24% 24%;background:radial-gradient(circle at 30% 35%,#d99142 0 8%,transparent 9%),radial-gradient(circle at 55% 45%,#ad542c 0 10%,transparent 11%),radial-gradient(circle at 72% 30%,#e2a353 0 9%,transparent 10%),radial-gradient(circle at 42% 68%,#c46c2c 0 9%,transparent 10%),#4d5948;border:9px solid #68735d;box-shadow:0 14px 20px #51361e33}.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px}.actions button{padding:13px 8px;border:0;border-radius:16px;font-weight:900}.next{background:#80a94e;color:#fff}.finish{background:#ed8a3e;color:#fff}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fffaf3ee;backdrop-filter:blur(15px);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 22px #6d47231c}.nav button{border:0;background:none;padding:7px;color:#967760;font-weight:800}.nav button.on{color:#54783b}.nav span{display:block;font-size:22px}.modal{position:fixed;inset:0;z-index:30;background:#3d291c77;display:flex;align-items:flex-end}.sheet{width:min(100%,620px);max-height:86dvh;overflow:auto;margin:auto;background:#fffaf3;border-radius:28px 28px 0 0;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.toggle{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.toggle.on{background:#e5f0da;border-color:#94b668}.toast{position:fixed;z-index:40;left:50%;bottom:95px;transform:translateX(-50%);background:#4c3628;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;white-space:nowrap}.empty{padding:24px;text-align:center;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.scene{padding:20px}}
</style>
</head>
<body>
<header class="top"><div class="logo">🍳</div><div><h1>我的小厨房</h1><p id="sub">有什么</p></div><div class="grow"></div><button class="pill" id="staples">厨房常备</button></header>
<main class="wrap"><section id="root" class="scene"></section></main>
<nav class="nav"><button data-s="fridge" class="on"><span>🧊</span>冰箱</button><button data-s="board"><span>🔪</span>菜板</button><button data-s="stove"><span>🍳</span>灶台</button></nav><div id="modal"></div><div id="toast"></div>
<script>
const E={鸡腿肉:'🍗',土豆:'🥔',包菜:'🥬',水饺:'🥟',牛奶:'🥛',鸡蛋:'🥚',番茄:'🍅',米饭:'🍚',面条:'🍜',包子:'🥟',蘑菇:'🍄'};
const META={chilled:['冷藏','0~4°C'],frozen:['冷冻','-18°C以下'],room:['常温','阴凉干燥'],ready:['熟食 / 半成品','尽快吃完']};
const defaultInv=[['鸡腿肉',300,'g','chilled','priority'],['土豆',2,'个','chilled','priority'],['包菜',.5,'颗','chilled','soon'],['水饺',.5,'袋','frozen','soon'],['牛奶',.5,'盒','room','later'],['昨晚土豆烧鸡',1,'份','ready','priority']].map((x,i)=>({id:'i'+i,name:x[0],quantity:x[1],unit:x[2],storage:x[3],urgency:x[4]}));
const defaultSet={seasonings:{盐:1,糖:1,生抽:1,老抽:0,料酒:0,醋:1,蚝油:1,淀粉:1},cookware:{炒锅:1,平底锅:1,汤锅:1,电饭煲:1,蒸锅:0,微波炉:1,空气炸锅:0,烤箱:0}};
const recipes=[
{id:'r1',name:'土豆烧鸡',icon:'🍲',desc:'家常美味 · 下饭首选',ings:[['鸡腿肉',300,'g',1],['土豆',2,'个',1]],season:[['生抽',1],['盐',1],['老抽',0]],tools:[['炒锅','平底锅']],steps:['鸡腿肉切块，土豆切块备用。','锅中少量油，下鸡腿肉炒至表面变色。','加入土豆块翻炒，加入生抽、老抽、盐调味。','加入适量清水，煮开后转中小火。','焖至土豆软糯、鸡肉熟透。','开盖收汁，尝味后出锅。']},
{id:'r2',name:'包菜炒鸡',icon:'🥘',desc:'清爽鲜香 · 快手下饭',ings:[['鸡腿肉',200,'g',1],['包菜',.5,'颗',1]],season:[['生抽',1],['盐',1],['蚝油',0]],tools:[['炒锅','平底锅']],steps:['鸡肉切小块，包菜撕成小片。','鸡肉下锅炒至变色。','加入包菜，大火快速翻炒。','加入生抽和盐调味。','包菜断生后即可出锅。']},
{id:'r3',name:'小鸡炖蘑菇',icon:'🍲',desc:'暖乎乎的一锅炖',ings:[['鸡腿肉',300,'g',1],['蘑菇',200,'g',1]],season:[['盐',1],['生抽',1],['料酒',0]],tools:[['汤锅','炒锅']],steps:['鸡肉和蘑菇处理干净。','鸡肉先煸炒出香味。','加入蘑菇翻炒。','加水与调味料煮开。','转小火炖至鸡肉熟透。','尝味出锅。']}
];
let state=JSON.parse(localStorage.getItem('mk01')||'null')||{inv:defaultInv,set:defaultSet,selected:['i0','i1','i2'],recipe:'r1',scene:'fridge',cook:null};
function save(){localStorage.setItem('mk01',JSON.stringify(state))}function q(s){return document.querySelector(s)}function qa(s){return [...document.querySelectorAll(s)]}function fmt(x){return x.quantity===.5&&['袋','盒','颗'].includes(x.unit)?'半'+x.unit:(x.quantity+x.unit)}function urgent(u){return {priority:['优先处理','priority'],soon:['最近可以安排','soon'],later:['暂时不急','later']}[u]}
function go(s){state.scene=s;save();render()}function toast(t){q('#toast').innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>q('#toast').innerHTML='',1800)}
function checkRecipe(r){let miss=[];for(const a of r.ings){let it=state.inv.find(x=>x.name===a[0]);if(!it||it.quantity<a[1])miss.push(a[0])}let sm=r.season.filter(x=>x[1]&&!state.set.seasonings[x[0]]).map(x=>x[0]),so=r.season.filter(x=>!x[1]&&!state.set.seasonings[x[0]]).map(x=>x[0]);let tool=r.tools.find(group=>group.some(x=>state.set.cookware[x]));return{miss,sm,so,tool,ok:!miss.length&&!sm.length&&!!tool}}
function render(){qa('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===state.scene));q('#sub').textContent={fridge:'有什么',board:'做什么',stove:'怎么做'}[state.scene];if(state.scene==='fridge')fridge();if(state.scene==='board')board();if(state.scene==='stove')stove()}
function fridge(){let html='<h2>🧊 冰箱 · 有什么</h2><div class="fridge">';for(const [k,m] of Object.entries(META)){let arr=state.inv.filter(x=>x.storage===k);html+=`<div class="card"><div class="head"><b>${m[0]}</b><small>${m[1]}</small></div><div class="grid">${arr.length?arr.map(x=>`<button class="food" data-edit="${x.id}"><div class="emo">${E[x.name]||'🥣'}</div><strong>${x.name}</strong><small>${fmt(x)}</small><span class="tag ${urgent(x.urgency)[1]}">${urgent(x.urgency)[0]}</span></button>`).join(''):'<div class="empty">暂无食物</div>'}</div></div>`}html+='</div><button class="primary" id="add">＋ 添加食材</button>';q('#root').innerHTML=html;q('#add').onclick=()=>foodModal();qa('[data-edit]').forEach(b=>b.onclick=()=>foodModal(b.dataset.edit))}
function board(){let selected=state.inv.filter(x=>state.selected.includes(x.id)&&x.storage!=='ready'),ranks=recipes.map(r=>[r,checkRecipe(r)]).sort((a,b)=>Number(b[1].ok)-Number(a[1].ok));q('#root').innerHTML=`<h2>🔪 菜板 · 做什么</h2><div class="board"><div class="head"><b>当前食材</b><small>已选 ${selected.length} 种</small></div><div class="selected">${selected.slice(0,3).map(x=>`<div class="sel"><div class="emo">${E[x.name]||'🥣'}</div><strong>${x.name}</strong><small>${fmt(x)}</small></div>`).join('')}</div></div><div class="card"><div class="head"><b>从冰箱选择</b><small>点击切换</small></div>${state.inv.filter(x=>x.storage!=='ready').map(x=>`<button class="secondary" data-pick="${x.id}" style="margin:3px;background:${state.selected.includes(x.id)?'#e3efd8':'#f4e3cf'}">${E[x.name]||'🥣'} ${x.name}</button>`).join('')}</div><div class="card"><div class="head"><b>根据现有条件推荐</b><small>食材 + 调味 + 厨具</small></div>${ranks.map(([r,c])=>`<div class="recipe ${state.recipe===r.id?'pick':''}" data-r="${r.id}"><div class="rTop"><div class="dish">${r.icon}</div><div class="grow"><h3>${r.name}</h3><small>${r.desc}</small></div><b class="${c.ok?'ok':'warn'}">${c.ok?'可直接做':'需确认'}</b></div><div class="checks"><div class="check">食材<br><b class="${c.miss.length?'bad':'ok'}">${c.miss.length?'缺 '+c.miss.join('、'):'已齐 ✓'}</b></div><div class="check">调味<br><b class="${c.sm.length?'bad':c.so.length?'warn':'ok'}">${c.sm.length?'缺 '+c.sm.join('、'):c.so.length?'缺 '+c.so.join('、')+' · 可省略':'已齐 ✓'}</b></div><div class="check">厨具<br><b class="${c.tool?'ok':'bad'}">${c.tool||'没有合适厨具'}</b></div></div></div>`).join('')}<button class="primary" id="start">开始准备</button></div>`;qa('[data-pick]').forEach(b=>b.onclick=()=>{state.selected.includes(b.dataset.pick)?state.selected=state.selected.filter(x=>x!==b.dataset.pick):state.selected.push(b.dataset.pick);save();render()});qa('[data-r]').forEach(b=>b.onclick=()=>{state.recipe=b.dataset.r;save();render()});q('#start').onclick=()=>{let r=recipes.find(x=>x.id===state.recipe),c=checkRecipe(r);if(!c.ok)return toast('还有必需条件没满足，请先检查红色提示');state.cook={recipe:r.id,step:0};save();go('stove')}}
function stove(){if(!state.cook){q('#root').innerHTML='<h2>🍳 灶台 · 怎么做</h2><div class="card empty">还没有开始做菜。先去菜板选一道能做的菜吧。<br><button class="primary" onclick="go(\'board\')">去菜板</button></div>';return}let r=recipes.find(x=>x.id===state.cook.recipe),c=checkRecipe(r),i=state.cook.step;q('#root').innerHTML=`<h2>🍳 灶台 · 怎么做</h2><div class="preflight">开火前已检查：✓ 食材　✓ 调味　✓ 厨具　放心做饭</div><div class="card cook"><div class="head"><div><h3>${r.icon} ${r.name}</h3><small>${r.desc}</small></div><b>步骤 ${i+1}/${r.steps.length}</b></div><div class="step">${r.steps[i]}</div><div class="timer">⏱️ 预计剩余时间：约 ${Math.max(5,(r.steps.length-i)*5)} 分钟</div><div class="pan"></div><div class="actions"><button class="secondary" id="prev">上一步</button><button class="next" id="next">下一步</button><button class="finish" id="done">完成烹饪</button></div></div>`;q('#prev').onclick=()=>{state.cook.step=Math.max(0,i-1);save();render()};q('#next').onclick=()=>{state.cook.step=Math.min(r.steps.length-1,i+1);save();render()};q('#done').onclick=()=>finishModal(r)}
function foodModal(id){let x=state.inv.find(i=>i.id===id)||{name:'',quantity:1,unit:'个',storage:'chilled',urgency:'soon'};q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>${id?'编辑食物':'添加食物'}</b><button class="secondary" id="close">关闭</button></div><label class="field">名称<input id="fn" value="${x.name}"></label><div class="row"><label class="field">数量<input id="fq" type="number" step="0.1" value="${x.quantity}"></label><label class="field">单位<select id="fu">${['g','kg','个','颗','袋','盒','份'].map(v=>`<option ${v===x.unit?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="row"><label class="field">存放<select id="fs">${Object.entries(META).map(([k,v])=>`<option value="${k}" ${k===x.storage?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="field">安排<select id="fg"><option value="priority">优先处理</option><option value="soon" ${x.urgency==='soon'?'selected':''}>最近安排</option><option value="later" ${x.urgency==='later'?'selected':''}>暂时不急</option></select></label></div><div class="row">${id?'<button class="secondary" id="del">删除</button>':'<span></span>'}<button class="primary" id="savef">保存</button></div></div></div>`;q('#close').onclick=close;q('#savef').onclick=()=>{let n=q('#fn').value.trim(),qty=+q('#fq').value;if(!n||!qty)return toast('请填写名称和数量');let o={id:id||'i'+Date.now(),name:n,quantity:qty,unit:q('#fu').value,storage:q('#fs').value,urgency:q('#fg').value};state.inv=id?state.inv.map(a=>a.id===id?o:a):[...state.inv,o];save();close();render()};if(id)q('#del').onclick=()=>{state.inv=state.inv.filter(a=>a.id!==id);state.selected=state.selected.filter(a=>a!==id);save();close();render()}}
function staples(){q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>厨房常备</b><button class="secondary" id="close">关闭</button></div><p class="muted">只记录“有 / 没有”，不用精确管理剩余量。</p><h3>调味料</h3><div class="toggles">${Object.keys(state.set.seasonings).map(n=>`<button class="toggle ${state.set.seasonings[n]?'on':''}" data-g="seasonings" data-n="${n}">${n}</button>`).join('')}</div><h3>厨具</h3><div class="toggles">${Object.keys(state.set.cookware).map(n=>`<button class="toggle ${state.set.cookware[n]?'on':''}" data-g="cookware" data-n="${n}">${n}</button>`).join('')}</div><button class="primary" id="saves">保存</button></div></div>`;q('#close').onclick=close;qa('.toggle').forEach(b=>b.onclick=()=>b.classList.toggle('on'));q('#saves').onclick=()=>{qa('.toggle').forEach(b=>state.set[b.dataset.g][b.dataset.n]=b.classList.contains('on')?1:0);save();close();render();toast('厨房常备已保存')}}
function finishModal(r){q('#modal').innerHTML=`<div class="modal"><div class="sheet"><div class="head"><b>这顿饭怎么样？</b><button class="secondary" id="close">关闭</button></div><p class="muted">不用称重，选一个最接近的结果即可。</p><button class="primary" data-f="done">吃完了</button><button class="primary" data-f="left" style="margin-top:8px;background:#d49b57">还有剩菜</button><button class="secondary" data-f="half" style="width:100%;margin-top:8px">只做了一部分</button></div></div>`;q('#close').onclick=close;qa('[data-f]').forEach(b=>b.onclick=()=>finish(r,b.dataset.f))}
function finish(r,type){let factor=type==='half'?.5:1;r.ings.filter(a=>a[3]).forEach(a=>{let x=state.inv.find(i=>i.name===a[0]);if(x&&x.unit===a[2]){x.quantity=Math.max(0,x.quantity-a[1]*factor);if(x.quantity<=.001)state.inv=state.inv.filter(i=>i.id!==x.id)}});if(type==='left')state.inv.push({id:'i'+Date.now(),name:r.name,quantity:1,unit:'份',storage:'ready',urgency:'priority'});state.cook=null;save();close();go('fridge');toast(type==='left'?'剩菜已放回冰箱':'库存已更新')}
function close(){q('#modal').innerHTML=''}qa('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));q('#staples').onclick=staples;render();
</script>
</body></html>
