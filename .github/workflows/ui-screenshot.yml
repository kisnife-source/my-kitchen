name: UI Screenshot Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'patch-v0115.js'
      - 'patch-v0115.css'
      - 'patch-v0116.js'
      - 'patch-v0116.css'
      - 'patch-v0117.js'
      - 'patch-v0117.css'
      - 'patch-v0117b.js'
      - 'patch-v0118.js'
      - 'patch-v0118.css'
      - 'patch-v0119.js'
      - 'hoc-recipes.generated.js'
      - 'tests/ui-screenshot.mjs'
      - 'tests/scale-audit.mjs'
      - 'tests/v0118-audit.mjs'
      - 'tests/product-audit.mjs'
      - '.github/workflows/ui-screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chinese fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using $CHROME_PATH"
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/my-kitchen-server.log 2>&1 &
          sleep 2
      - name: Capture mobile walkthrough
        run: node tests/ui-screenshot.mjs
      - name: Audit expanded library scale
        run: node tests/scale-audit.mjs
      - name: Audit V0.1.19 regressions
        run: node tests/v0118-audit.mjs
      - name: Product-level interaction audit
        run: node tests/product-audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: error
